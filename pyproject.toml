[project]
name = "mc-gesture"
version = "0.1.0"
description = "A reusable local gesture-control engine for interactive installations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # mediapipe pulls in opencv-contrib-python; a second OpenCV package would clash over cv2
    "mediapipe==1.1.1",
    "numpy>=1.26",
    "oneeurofilter>=0.2.1",
    "websockets>=17.4",
]

[project.scripts]
mc-gesture = "mc_gesture.run:main"
mc-gesture-view = "mc_gesture.run:view_main"
mc-gesture-calibrate = "mc_gesture.calibration.routine:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_gesture"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
