[project]
name = "mc-gesture"
version = "0.1.0"
description = "A reusable local gesture-control engine for interactive installations"
readme = "DECISIONS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # mediapipe pulls in opencv-contrib-python; a second OpenCV package would clash over cv2
    "mediapipe==1.1.1",
    "numpy>=1.26",
]

[project.scripts]
mc-gesture-view = "mc_gesture.viewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_gesture"]
